version: v1.0
name: Complex pipeline without dependencies
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
global_job_config:
  prologue:
    commands:
      - checkout
      - git clone https://github.com/semaphoreio/semaphore.git
      
blocks:
  - name: A
    dependencies: ["C"]
    task:
      jobs:
        - name: A
          commands:
            - sleep 20
            - echo "here 123"
  - name: B 
    dependencies: ["A"]
    task:
      jobs:
        - name: B
          commands:
            - sleep 20
            - echo "here 123"

  - name: C
    dependencies: ["B"]
    task:
      jobs:
        - name: C
          commands:
            - sleep 20
            - echo "here 123"
